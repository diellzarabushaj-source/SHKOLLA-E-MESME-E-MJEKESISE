name: Build check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_AUTH_BASE_URL: https://ep-long-wind-at258oxo.neonauth.c-9.us-east-1.aws.neon.tech/neondb/auth
      NEON_AUTH_COOKIE_SECRET: ci-only-cookie-secret-with-more-than-32-characters
      NEXT_PUBLIC_NEON_DATA_API_URL: https://ep-long-wind-at258oxo.apirest.c-9.us-east-1.aws.neon.tech/neondb/rest/v1
      NEXT_PUBLIC_SANITY_PROJECT_ID: u5d5zn7n
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_DATASET_V2: schoolv2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build application
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-check.log
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-check-diagnostics
          path: build-check.log
          retention-days: 3
      - name: Audit routes and navigation
        run: npm run audit:navigation
      - name: Audit app configuration and smoothness
        run: npm run audit:smoothness
      - name: Audit private lesson annotations
        run: npm run audit:annotations
      - name: Audit administrator and Sanity synchronization
        shell: bash
        run: |
          set -o pipefail
          npm run audit:admin-sanity 2>&1 | tee admin-sanity-audit.log
      - name: Upload administrator audit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: administrator-audit-diagnostics
          path: admin-sanity-audit.log
          retention-days: 3
