name: Verify and apply embedded flashcards

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-embedded-flashcards-main.yml
  issues:
    types:
      - opened

permissions:
  contents: write

jobs:
  migrate-build-and-commit:
    if: github.event_name == 'push' || github.event.issue.title == '[automation] apply embedded flashcards'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Load guarded migration script
        run: |
          git fetch origin refactor/embedded-flashcards
          git show origin/refactor/embedded-flashcards:scripts/apply-embedded-flashcards.mjs > /tmp/apply-embedded-flashcards.mjs

      - name: Apply frontend query optimization
        run: node /tmp/apply-embedded-flashcards.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck and production build
        run: npm run audit:app

      - name: Commit only after successful build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ClassicLearningPortal.tsx package-lock.json
          if git diff --cached --quiet; then
            echo "No verified changes to commit."
            exit 0
          fi
          git commit -m "Read flashcards from embedded lesson arrays"
          git push origin HEAD:main
