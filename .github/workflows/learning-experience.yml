name: Automatic lesson hierarchy browser audit

on:
  pull_request:
    branches: [main]
    paths:
      - app/MarkdownLessonContent.tsx
      - app/MarkdownLessonContent.module.css
      - app/LessonLearningExperience.tsx
      - app/LessonLearningExperience.module.css
      - app/LessonContentRenderer.tsx
      - app/PerfectLessonLearningExperience.tsx
      - app/learning-experience-audit/**
      - scripts/add-learning-experience.mjs
      - scripts/add-markdown-lesson-formatting.mjs
      - scripts/perfect-learning-engine.mjs
      - scripts/audit-learning-experience.mjs
      - scripts/audit-heading-consistency.mjs
      - scripts/audit-perfect-learning-engine.mjs
      - scripts/e2e-learning-experience.mjs
      - package.json
      - package-lock.json
      - .github/workflows/learning-experience.yml
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  learning-experience-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEON_AUTH_BASE_URL: https://ep-long-wind-at258oxo.neonauth.c-9.us-east-1.aws.neon.tech/neondb/auth
      NEON_AUTH_COOKIE_SECRET: ci-only-cookie-secret-with-more-than-32-characters
      NEXT_PUBLIC_NEON_DATA_API_URL: https://ep-long-wind-at258oxo.apirest.c-9.us-east-1.aws.neon.tech/neondb/rest/v1
      NEXT_PUBLIC_SANITY_PROJECT_ID: u5d5zn7n
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_DATASET_V2: schoolv2
      E2E_LEARNING_EXPERIENCE_AUDIT: 1
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application dependencies
        run: npm install
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
      - name: Audit production learning contracts
        run: npm run audit:learning
      - name: Test automatic hierarchy and exact text preservation
        shell: bash
        run: |
          set -uo pipefail
          npm run start > learning-experience-server.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat learning-experience-server.log
              exit 1
            fi
            sleep 1
          done

          set +e
          node scripts/e2e-learning-experience.mjs > learning-experience-e2e.log 2>&1
          STATUS=$?
          set -e
          cat learning-experience-e2e.log
          if [ "$STATUS" -ne 0 ]; then
            cat learning-experience-server.log
            exit 1
          fi
      - name: Upload learning experience diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-experience-browser-logs
          path: |
            learning-experience-e2e.log
            learning-experience-server.log
          retention-days: 1
