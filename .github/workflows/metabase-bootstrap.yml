name: Bootstrap Metabase SDK

on:
  push:
    branches:
      - feat/metabase-dashboard

permissions:
  contents: write

jobs:
  install-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/metabase-dashboard
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Metabase SDK
        run: pnpm add @metabase/embedding-sdk-react@0.63.1 --save-exact

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Commit package and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Metabase SDK is already installed."
          else
            git commit -m "Install Metabase embedding SDK"
            git push origin HEAD:feat/metabase-dashboard
          fi
