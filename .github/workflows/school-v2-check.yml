name: School v2 data-layer check

on:
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - scripts/build-schoolv2-portal-v2.mjs
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/school-v2-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Generate optimized portal
        run: npm run prepare:portal
      - name: Confirm generated data layer
        run: |
          grep -q 'dataset: process.env.NEXT_PUBLIC_SANITY_DATASET_V2 || "schoolv2"' app/SchoolLearningPortal.tsx
          grep -q 'count(flashcards\[isActive != false\])' app/SchoolLearningPortal.tsx
          grep -q 'useCdn: true' app/SchoolLearningPortal.tsx
          grep -q '"url": asset->url' app/SchoolLearningPortal.tsx
          ! grep -q '_type == "flashcard"' app/SchoolLearningPortal.tsx
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
