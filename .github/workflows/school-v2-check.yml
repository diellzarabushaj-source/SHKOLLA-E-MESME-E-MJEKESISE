name: School v2 data-layer check

on:
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - public/sw.js
      - scripts/build-schoolv2-portal-v2.mjs
      - scripts/align-sanity-v2.mjs
      - scripts/harden-sanity-runtime.mjs
      - scripts/audit-sanity-runtime.mjs
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/school-v2-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Generate optimized portal
        run: npm run prepare:portal
      - name: Confirm generated data layer
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const source = readFileSync('app/SchoolLearningPortal.tsx', 'utf8');
          const worker = readFileSync('public/sw.js', 'utf8');
          const required = [
            'projectId: "u5d5zn7n"',
            'dataset: "schoolv2"',
            'count(flashcards[isActive != false])',
            'useCdn: false',
            '"url": asset->url',
            'sanity-v2-contract-v2',
          ];
          for (const value of required) {
            if (!source.includes(value)) throw new Error(`Missing generated architecture marker: ${value}`);
          }
          if (source.includes('_type == "flashcard"')) {
            throw new Error('Standalone flashcard document query is still present.');
          }
          if (!worker.includes('GROQ/query JSON must never be served stale')) {
            throw new Error('Service worker can still serve stale Sanity query data.');
          }
          console.log('School v2 data layer verified with fixed dataset and fresh query delivery.');
          NODE
      - name: Verify Sanity runtime protections
        run: npm run audit:sanity-runtime
      - name: TypeScript check
        # prepare:portal already ran above. npm run typecheck would trigger
        # pretypecheck and regenerate the generated portal a second time.
        run: npx tsc --noEmit
