name: School v2 build check

on:
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - scripts/build-schoolv2-portal-v2.mjs
      - package.json
      - tsconfig.json
      - next.config.*
      - .github/workflows/school-v2-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Generate optimized portal
        run: npm run prepare:portal
      - name: Confirm generated data layer
        run: |
          grep -q 'dataset: process.env.NEXT_PUBLIC_SANITY_DATASET_V2 || "schoolv2"' app/SchoolLearningPortal.tsx
          grep -q 'count(flashcards\[status != "hidden"\])' app/SchoolLearningPortal.tsx
          grep -q 'useCdn: true' app/SchoolLearningPortal.tsx
          ! grep -q '_type == "flashcard"' app/SchoolLearningPortal.tsx
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: |
          set +e
          npx next build > /tmp/school-v2-build.log 2>&1
          status=$?
          tail -n 120 /tmp/school-v2-build.log
          exit $status
