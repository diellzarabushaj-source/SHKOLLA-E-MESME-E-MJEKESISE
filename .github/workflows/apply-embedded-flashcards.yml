name: Apply embedded flashcards

on:
  push:
    branches:
      - refactor/embedded-flashcards
    paths:
      - scripts/apply-embedded-flashcards.mjs
      - .github/workflows/apply-embedded-flashcards.yml

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/embedded-flashcards
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded source migration
        run: node scripts/apply-embedded-flashcards.mjs

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck and build
        run: npm run audit:app

      - name: Commit verified frontend change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ClassicLearningPortal.tsx package-lock.json
          if git diff --cached --quiet; then
            echo "No frontend changes to commit."
            exit 0
          fi
          git commit -m "Read flashcards from lesson arrays"
          git push origin HEAD:refactor/embedded-flashcards
