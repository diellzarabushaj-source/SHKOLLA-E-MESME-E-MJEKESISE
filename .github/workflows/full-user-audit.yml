name: Full live user audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  live-user-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_BASE_URL: https://shkolla-e-mesme-e-mjekesise-ct9t.vercel.app
      AUDIT_USERNAME: qa.portal.audit
      AUDIT_PASSWORD: PortalAudit2026!
      NEON_AUTH_BASE_URL: https://ep-long-wind-at258oxo.neonauth.c-9.us-east-1.aws.neon.tech/neondb/auth
      NEON_AUTH_COOKIE_SECRET: ci-only-cookie-secret-with-more-than-32-characters
      NEXT_PUBLIC_NEON_DATA_API_URL: https://ep-long-wind-at258oxo.apirest.c-9.us-east-1.aws.neon.tech/neondb/rest/v1
      NEXT_PUBLIC_SANITY_PROJECT_ID: u5d5zn7n
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_DATASET_V2: schoolv2
      E2E_ADMIN_AUDIT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and Chromium
        run: |
          npm install
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Prepare live audit
        run: |
          node scripts/prepare-live-user-audit.mjs
          node scripts/prepare-live-user-audit-v2.mjs
      - name: Run complete live user journey
        shell: bash
        run: |
          set -o pipefail
          node scripts/e2e-live-full-user-audit.mjs 2>&1 | tee full-user-audit.log
      - name: Run isolated administrator editor audit
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: bash scripts/run-admin-editor-audit-ci.sh
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-live-user-audit
          path: |
            full-user-audit.log
            admin-editor-e2e.log
            admin-audit-server.log
            artifacts/full-user-audit
            artifacts/admin-editor-audit
          retention-days: 3
